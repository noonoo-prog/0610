function question(){if(qi>=questions.length){creationEnd();return}$('#app').innerHTML='<section class="setup panel center"><span class="tag">너를 알아가는 중 · '+(qi+1)+' / 6</span>'+animal(draft)+'<div class="progress"><i style="width:'+qi/6*100+'%"></i></div><h2>'+questions[qi][0]+'</h2><div class="answers">'+questions[qi][1].map((a,i)=>btn(a,'answer('+i+')')).join('')+'</div><p class="muted" style="margin-top:18px;font-size:13px">답할 때마다 얼굴 분위기가 조금씩 변해요.</p></section>'}

'이번 생':()=>{const tasks=[s.jobs.length>=3,s.moved,new Set(s.cards.map(c=>c.id)).size>=30,false];const count=tasks.filter(Boolean).length;const eligible=count>=3&&s.day>=7;const completion=Math.round((Math.min(s.jobs.length/3,1)+Number(s.moved)+Math.min(new Set(s.cards.map(c=>c.id)).size/30,1)+Number(s.items.some(x=>x.startsWith('차량:')))+Math.min(s.day/7,1))/5*100);$('#main').innerHTML='<h2>이번 생 완성도 '+completion+'%</h2><div class="progress"><i style="width:'+completion+'%"></i></div><p>알바 '+s.jobCount+'회 · 복권 최고 '+fmt(s.best)+'원</p><h3>새로운 생으로 가는 길</h3><p class="muted">7일 이상 생활 + 아래 4개 중 3개 달성</p>'+['알바 3종 경험','첫 집에서 이사','서로 다른 카드 30장','친구 콘텐츠 5회 · 후속 연결'].map((t,i)=>'<div class="log">'+(tasks[i]?'✓':'○')+' '+t+'</div>').join('')+'<div class="notice">현재는 혼자 달성 가능한 앞의 세 조건으로 환생할 수 있어요. 완성도는 1차 버전의 생활 목표 5개 기준입니다.</div>'+btn(eligible?'유품 고르고 환생하기':'환생 조건 '+count+' / 3 · 생활 '+s.day+' / 7일','rebirth()','primary')+'<h3 style="margin-top:25px">추억 보관함</h3>'+s.past.map(p=>'<div class="log">'+p.generation+'대 · '+species[p.species][1]+' / '+p.home+' / '+p.days+'일<br><small>유품: '+p.heirloom+' · 최고 당첨 '+fmt(p.best)+'원</small></div>').join('')+'<h3 style="margin-top:25px">이번 생 기록</h3>'+s.logs.map(l=>'<div class="log"><small>'+l.day+'일째</small> '+l.text+'</div>').join('')}

function itemIcon(x){return goods.find(g=>g[0]===x)?.[2]||(x.startsWith('인형:')?'🧸':x.startsWith('카드:')?'🖼️':'📷')}
function spend(n){if(s.money<n){toast('돈이 조금 부족해요. 알바를 해볼까요?');return false}s.money-=n;save();return true}
function sleep(){s.day++;s.energy=5;log('푹 자고 새로운 하루를 맞았다.');render();toast('체력이 모두 회복됐어요.')}
function moveHome(){if(s.moved||!spend(60000))return;s.moved=true;s.home='햇살 원룸';log('햇살이 들어오는 원룸으로 첫 이사를 했다.');render()}
function buy(i){const g=goods[i];if(s.items.includes(g[0])){if(g[0].startsWith('옷:')){s.char.shirt=i===0?'#d4ab51':'#dc8c94';save();render();toast('옷을 갈아입었어요.')}return}if(!spend(g[1]))return;s.items.push(g[0]);if(g[0].startsWith('옷:'))s.char.shirt=i===0?'#d4ab51':'#dc8c94';log(g[0].split(':')[1]+'을(를) 샀다.');render();toast('내 물건이 하나 늘었어요.')}

function prize(r){return r<1?10000000:r<6?1000000:r<56?100000:r<256?50000:r<1256?10000:r<3256?5000:r<23256?1000:0}

let revealSession=null, revealTimer=null;
function cancelReveal(){clearTimeout(revealTimer);revealSession=null}
function confetti(){return '<div class="celebration" aria-hidden="true">'+Array.from({length:26},(_,i)=>'<i style="--x:'+(i*37%100)+'%;--color:'+['#efb83f','#6da0cd','#dc8f9c','#9abc9c'][i%4]+';--delay:'+(i%7*.08)+'s"></i>').join('')+'</div>'}
function lottery(){if(!spend(1000))return;cancelReveal();const win=prize(random(100000));s.money+=win;s.best=Math.max(s.best,win);log(win?'복권에서 '+fmt(win)+'원이 당첨됐다!':'복권은 꽝. 다음엔 좋은 일이 있을까?');render();revealSession={type:'lottery',win,revealed:false};const m=$('#modal');m.className='reveal-dialog';m.innerHTML=btn('×','closeModal()','close')+'<div class="center"><div class="reveal-kicker">MOA LUCKY TICKET</div><h2 class="reveal-heading">오늘의 행운을 긁어보세요</h2><p class="muted">손끝에서 시작되는 작은 기대.</p><div class="scratch-ticket"><div class="ticket-top"><b>모아동 행운복권</b><span>1장 · 1,000원</span></div><div class="scratch-zone"><div class="scratch-result" aria-hidden="true"><span>'+(win?'🍀':'🍂')+'</span><strong>'+(win?fmt(win)+'원':'다음 기회에')+'</strong></div><canvas id="scratch" class="scratch-cover" width="800" height="340" role="img" aria-label="은색 영역을 손가락이나 마우스로 긁어주세요"></canvas></div></div><div id="scratchStatus" class="scratch-status" aria-live="polite">은색 부분을 절반 정도 긁으면 결과가 나타나요.<br>버튼으로 한 번에 확인할 수도 있어요.</div><div id="lotteryActions" class="row reveal-actions">'+btn('한 번에 긁기','finishScratch()','primary')+'</div><p class="pack-note">당첨 결과는 구매 즉시 저장됩니다.</p></div>';setupScratch()}
function setupScratch(){const canvas=$('#scratch'),ctx=canvas.getContext('2d');if(!ctx){finishScratch();return}const grad=ctx.createLinearGradient(0,0,800,340);grad.addColorStop(0,'#a8b2bf');grad.addColorStop(.45,'#e2e8ef');grad.addColorStop(1,'#9ca8b8');ctx.fillStyle=grad;ctx.fillRect(0,0,800,340);ctx.fillStyle='#718093';ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.fillText('여기를 긁어주세요',400,168);ctx.font='20px system-ui';ctx.fillText('SCRATCH & FIND YOUR LUCK',400,210);let drawing=false,last=null;
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*340/r.height}}
function draw(e){if(!drawing||!revealSession||revealSession.revealed)return;e.preventDefault();const p=point(e);ctx.globalCompositeOperation='destination-out';ctx.lineWidth=64;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last?.x??p.x,last?.y??p.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,32,0,Math.PI*2);ctx.fill();last=p}
canvas.addEventListener('pointerdown',e=>{drawing=true;last=point(e);canvas.setPointerCapture(e.pointerId);draw(e)});canvas.addEventListener('pointermove',draw);function stop(){if(!drawing)return;drawing=false;last=null;const data=ctx.getImageData(0,0,800,340).data;let count=0,total=0;for(let i=3;i<data.length;i+=64){total++;if(data[i]<100)count++}if(count/total>=.42)finishScratch()}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop)}
function finishScratch(){const r=revealSession;if(!r||r.type!=='lottery'||r.revealed)return;r.revealed=true;$('#scratch').classList.add('cleared');$('.scratch-result').setAttribute('aria-hidden','false');const big=r.win>=1000000;$('.reveal-heading').textContent=big?'이번 생의 큰 전환점!':r.win?'오늘의 행운, 찾았다!':'오늘의 운은 잠깐 쉬는 중';$('.reveal-heading').classList.add('win-title');$('#scratchStatus').innerHTML='<strong>'+(r.win?fmt(r.win)+'원 당첨!':'아쉽지만 꽝이에요.')+'</strong><br>'+(big?'차 한 대, 새로운 집. 무엇부터 바꿔볼까?':r.win?'당첨금은 지갑에 들어갔어요.':'골목에는 아직 재미있는 일이 남아 있어요.');$('#lotteryActions').innerHTML=btn('한 장 더 · 1,000원','lottery()','gold')+btn('돌아가기','closeModal()');if(r.win>=50000){$('#modal').classList.add('jackpot');$('#modal').insertAdjacentHTML('beforeend',confetti())}}
function cardHTML(c){return '<div class="card '+(c.special?'special':'')+'"><span class="icon">'+icons[c.id]+'</span><b>'+cardNames[c.id]+'</b><small>'+(c.special?'SPECIAL · 개인 수집번호 '+c.serial:'동네도감 · '+String(c.id+1).padStart(2,'0'))+'</small></div>'}
function packInfo(){openModal('<h2>동네도감 카드팩</h2><p>한 팩 3장 · 3,000원</p><div class="notice">기본 카드 30종은 동일 확률입니다. 각 카드마다 별도로 1/2,000 확률로 특별판이 나옵니다. 중복도 나와요. 특별판 번호는 현재 기기 내 개인 수집번호입니다.</div>'+btn('카드팩 개봉하기','openPack()','primary'))}

function tearPack(){const r=revealSession;if(!r||r.type!=='pack'||r.dealt)return;r.dealt=true;$('#sealedPack').classList.add('opening');const trigger=$('.pack-stage button');trigger.disabled=true;trigger.textContent='봉투를 여는 중…';revealTimer=setTimeout(()=>{if(revealSession!==r)return;showPackCards()},550)}
function showPackCards(){const r=revealSession;if(!r||r.type!=='pack')return;$('#modal').innerHTML=btn('×','closeModal()','close')+'<div class="center"><div class="reveal-kicker">THREE LITTLE MOMENTS</div><h2>한 장씩, 오늘의 발견</h2><div class="reveal-cards">'+r.cards.map((c,i)=>'<button class="flip-card" id="revealCard'+i+'" style="--deal:'+i*.1+'s" onclick="flipCard('+i+')" aria-label="'+(i+1)+'번째 카드 뒤집기"><span class="flip-inner"><span class="card-back"><span>✦</span><b>동네도감</b><small>눌러서 뒤집기</small></span><span class="card-front" aria-hidden="true"><span class="icon">'+icons[c.id]+'</span><b>'+cardNames[c.id]+'</b><small>'+(c.special?'SPECIAL #'+c.serial:'동네도감 '+String(c.id+1).padStart(2,'0'))+'</small></span></span></button>').join('')+'</div><div class="pack-feedback" id="packFeedback" aria-live="polite"><p class="muted">마음이 가는 카드부터 뒤집어보세요.</p></div><div class="row reveal-actions" id="packActions">'+btn('모두 뒤집기','revealAllCards()')+'</div></div>'}
function flipCard(i){const r=revealSession;if(!r||r.type!=='pack'||r.opened.includes(i))return;r.opened.push(i);const c=r.cards[i],b=$('#revealCard'+i);b.classList.add('revealed');if(c.special)b.classList.add('is-special');b.setAttribute('aria-label',cardNames[c.id]+(c.special?' 특별판':''));b.querySelector('.card-front').setAttribute('aria-hidden','false');b.querySelector('.card-back').setAttribute('aria-hidden','true');if(c.special){$('#packFeedback').innerHTML='<div class="special-caption">1 / 2,000 · SPECIAL EDITION</div><h3>이 순간, 오래 기억해.</h3><span class="pack-note">'+cardNames[c.id]+' 특별판을 발견했어요!</span>';$('#modal').insertAdjacentHTML('beforeend',confetti())}else if(!r.opened.some(k=>r.cards[k].special)){$('#packFeedback').innerHTML='<h3>'+cardNames[c.id]+'</h3><p class="pack-note">'+r.opened.length+' / 3장의 순간을 발견했어요.</p>'}if(r.opened.length===3){$('#packActions').innerHTML=btn('한 팩 더 · 3,000원','openPack()','primary')+btn('도감에서 보기',"closeModal();go('도감')")}}
function revealAllCards(){for(let i=0;i<3;i++)flipCard(i)}
function startJob(type){if(!s.energy){toast('체력이 부족해요. 집에서 쉬고 오세요.');return}openModal('<h2>'+({shelf:'편의점 진열',cafe:'카페 음료',parcel:'택배 분류'}[type])+'</h2><p>'+({shelf:'표시된 주문과 같은 물건을 눌러주세요.',cafe:'커피가 초록색 구간에 왔을 때 눌러주세요.',parcel:'택배에 적힌 주소와 같은 구역을 눌러주세요.'}[type])+'</p><p class="notice">30초 · 체력 1 · 기본 5,000원 + 정답당 500원, 최대 15,000원<br>중간에 닫으면 보상 없이 종료됩니다.</p>'+btn('준비됐어요','launchJob(\''+type+'\')','primary'))}
function launchJob(type){s.energy--;save();game={type,score:0,end:performance.now()+30000,last:0};$('#modal').innerHTML='<h2 id="gameTitle">알바 중</h2><div class="row"><span id="clock" class="tag"></span><span id="score" class="tag">정답 0</span></div><div id="task"></div>';nextTask();tick()}
function nextTask(){if(!game)return;game.target=random(3);if(game.type==='cafe'){$('#task').innerHTML='<p style="margin-top:20px">초록 구간에서 커피를 멈춰주세요!</p><div class="track"><div class="target"></div><div class="cursor" id="cursor">☕</div></div>'+btn('지금 담기','hit(0)','primary game-btn')}else{const a=game.type==='shelf'?['🧃 주스','🥛 우유','🍙 주먹밥']:['가 구역','나 구역','다 구역'];$('#task').innerHTML='<h1 class="center" style="padding:30px 0">'+(game.type==='shelf'?'주문: ':'배송지: ')+a[game.target]+'</h1><div class="grid">'+a.map((v,i)=>btn(v,'hit('+i+')')).join('')+'</div>'}}
function tick(){if(!game)return;const now=performance.now();$('#clock').textContent=Math.max(0,Math.ceil((game.end-now)/1000))+'초';if(game.type==='cafe'||game.type==='claw'){game.pos=(Math.sin(now/(game.type==='claw'?480:350))+1)*50;$('#cursor').style.left=game.pos+'%'}if(now>=game.end){endGame(false);return}anim=requestAnimationFrame(tick)}
function hit(i){if(!game||performance.now()<game.last+220)return;if(performance.now()>=game.end){endGame(false);return}game.last=performance.now();if(game.type==='claw'){const won=Math.abs(game.pos-50)<10&&random(100)<85;const name='인형:'+['졸린 햄스터','구름 토끼','꼬마 여우','빵실 곰'][random(4)];game=null;cancelAnimationFrame(anim);if(won){if(!s.items.includes(name))s.items.push(name);else{s.money+=500;toast('중복 인형은 보관 보너스 500원으로 받았어요.')}log(name.split(':')[1]+' 인형을 뽑았다!')}else log('인형이 집게 끝에서 미끄러졌다.');render();$('#modal').innerHTML='<div class="center"><span class="icon">🧸</span><h2>'+(won?name.split(':')[1]+' 획득!':'아슬아슬, 놓쳤다!')+'</h2>'+btn('돌아가기','closeModal()','primary')+'</div>';return}const correct=game.type==='cafe'?Math.abs(game.pos-50)<10:i===game.target;if(correct)game.score++;$('#score').textContent='정답 '+game.score+(correct?' · 좋아요!':' · 다시!');nextTask()}
function endGame(abort){if(!game)return;const g=game;game=null;cancelAnimationFrame(anim);if(abort){$('#modal').close();render();return}if(g.type==='claw'){log('인형뽑기 시간을 놓쳤다.');$('#modal').close();render();toast('시간이 다 됐어요.');return}const wage=5000+Math.min(g.score,20)*500;s.money+=wage;s.jobCount++;if(!s.jobs.includes(g.type))s.jobs.push(g.type);log(({shelf:'편의점',cafe:'카페',parcel:'택배'}[g.type])+' 알바로 '+fmt(wage)+'원을 벌었다.');render();$('#modal').innerHTML='<div class="center"><span class="icon">💌</span><h2>수고했어요!</h2><h1>'+fmt(wage)+'원</h1><p>정답 '+g.score+'개 · 오늘도 한 걸음.</p>'+btn('월급 챙기기','closeModal()','primary')+'</div>'}
function clawInfo(){openModal('<h2>작은 인형뽑기방</h2><p>집게가 가운데 초록 구간에 왔을 때 잡아보세요.</p><div class="notice">1회 2,000원 · 제한 15초<br>초록 구간 안에서 잡으면 85% 확률로 성공, 바깥이면 실패합니다. 중간에 종료해도 비용은 돌아오지 않아요.</div>'+btn('도전하기 · 2,000원','launchClaw()','gold'))}
function launchClaw(){if(!spend(2000))return;game={type:'claw',score:0,end:performance.now()+15000,last:0};$('#modal').innerHTML='<h2>조금만 더… 지금!</h2><span id="clock" class="tag"></span><div class="track"><div class="target"></div><div class="cursor" id="cursor">🪝</div></div>'+btn('잡기!','hit(0)','gold game-btn');tick()}
function rebirth(){if(s.day<7||s.jobs.length<3||!s.moved||new Set(s.cards.map(c=>c.id)).size<30){toast('생활 7일, 알바 3종, 첫 이사, 도감 30종을 채워주세요.');return}let choices=[...s.items,...s.cards.map(c=>'카드:'+cardNames[c.id]),'사진:이번 생의 나'];choices=[...new Set(choices)];rebirth.choices=choices;openModal('<h2>다음 생에도 함께할 하나</h2><p>돈·집·도감·소지품은 새로운 생에서 다시 시작합니다. 추억과 이전 유품은 남아요.</p><label for="heir">가져갈 유품</label><select id="heir">'+choices.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('')+'</select><div class="notice">유품은 판매·교환·분해 불가. 자동차는 차 자체 대신 복원용 열쇠로 남습니다. 차량 복원은 후속 버전에서 제공됩니다.</div>'+btn('기록을 남기고 새로운 생으로','confirmRebirth()','primary'))}
function confirmRebirth(){pendingHeirloom=rebirth.choices[Number($('#heir').value)];if(pendingHeirloom.startsWith('차량:'))pendingHeirloom='열쇠:'+pendingHeirloom.split(':')[1];reincarnating=true;closeModal();creation()}
setInterval(()=>{if(s&&!document.hidden&&!reincarnating){s.playSeconds+=15;save()}},15000);
start();
</script></body></html>

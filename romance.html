<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>거봉동네 · 우연이 사랑이 될 때</title>
<style>
:root{color-scheme:light;--ink:#332a3b;--muted:#796d80;--line:#ecdce5;--pink:#e86d93;--purple:#7f67a7;--paper:#fffbfd;--shadow:0 18px 55px #56334912}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(circle at 10% 8%,#ffe7df 0,transparent 30%),radial-gradient(circle at 95% 20%,#eee0ff 0,transparent 34%),#fff8f6;color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #8d53a9;outline-offset:3px}
button:disabled{opacity:.47;cursor:not-allowed}
a{color:inherit}
.wrap{max-width:1110px;margin:auto;padding:24px 22px 46px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-size:24px;font-weight:900;letter-spacing:-1.2px}
.brand small{display:block;font-size:11px;letter-spacing:2px;font-weight:800;color:var(--purple)}
.link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #e6d5e1;background:#fff9fc;border-radius:14px;padding:11px 16px;font-weight:800;min-height:44px}
.pill{display:inline-block;border-radius:99px;background:#fff0f5;color:#a94e76;font-size:12px;font-weight:900;letter-spacing:.3px;padding:5px 11px}
.stat{display:inline-flex;align-items:center;gap:7px;border:1px solid #efdfe8;border-radius:13px;padding:8px 12px;background:#fffafc;font-size:13px;font-weight:800}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(27px,4.4vw,45px);line-height:1.25;letter-spacing:-1.8px}
h2{font-size:clamp(22px,3vw,28px);line-height:1.35;letter-spacing:-.8px}
h3{font-size:17px;letter-spacing:-.35px}
p{line-height:1.75}
.sub{color:var(--muted);font-size:14px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:25px;align-items:center;background:linear-gradient(125deg,#fff,#fff3f5 70%,#efe1fa);border:1px solid #f2e4eb;border-radius:30px;padding:32px 35px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero:before{content:"✦";position:absolute;right:25%;top:13px;font-size:42px;color:#e9b8ce66}
.hero h1{margin:13px 0 12px}
.hero .desc{color:#675b69;max-width:550px}
.hero-art{position:relative;min-height:235px;display:grid;place-items:center}
.hero-art:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffdedf;filter:blur(2px)}
.hero-art:after{content:"♥";position:absolute;top:0;right:10%;font-size:44px;color:#e99abe;transform:rotate(13deg)}
.hero-art .avatar{position:relative;z-index:1;width:220px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border-radius:14px;padding:12px 18px;font-weight:850;background:#f9edf2;color:#5b4960;border:1px solid #ecdbe4;min-height:46px;box-shadow:0 3px 0 #48293b08}
.btn:hover:not(:disabled){filter:brightness(.98);transform:translateY(-1px)}
.btn.primary{color:#fff;background:#a35d8b;border-color:#a35d8b}
.btn.light{background:#fff}
.btn.ghost{background:transparent;border-color:#d8cbd6}
.btn.full{width:100%}
.menu{display:flex;gap:8px;overflow-x:auto;margin:20px 0;padding:3px 2px 6px}
.menu .btn{white-space:nowrap}
.menu .btn.active{color:#fff;background:#5b465f;border-color:#5b465f}
.section-header{margin:27px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:12px}
.section-header p{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.npc{position:relative;background:#fff;border:1px solid #f0e4eb;border-radius:22px;padding:17px;box-shadow:0 10px 25px #4d2f4810;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.npc:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--accent,#e7a2be)}
.npc .portrait-box{display:grid;place-items:center;min-height:170px;background:var(--bg,#fff0f4);border-radius:17px;margin:8px 0 13px;position:relative;overflow:hidden}
.npc .portrait-box:after{content:"♥";position:absolute;right:12px;top:4px;color:#ffffff95;font-size:38px}
.npc .avatar{position:relative;z-index:1;width:168px}
.npc .name{font-size:20px;font-weight:900;line-height:1.3}
.npc .job{font-size:12px;color:#876f83;margin:4px 0 8px;min-height:20px}
.npc .quote{color:#655767;font-size:13px;min-height:70px;flex:1}
.npc .btn{margin-top:14px;width:100%;font-size:14px}
.aff{display:flex;gap:5px;align-items:center;margin-top:11px}
.aff i{height:7px;border-radius:8px;background:#f2e5eb;flex:1;min-width:0}
.aff i.on{background:#e77c9b}
.aff-text{font-size:12px;color:#9b5279;font-weight:900;margin-top:5px}
.avatar{aspect-ratio:1;display:grid;place-items:center}
.avatar .sprite{width:87%;background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 5px 2px #4530400e)}
.panel{background:#fff;border:1px solid #f0e4eb;border-radius:23px;padding:23px;box-shadow:var(--shadow)}
.relation{display:grid;grid-template-columns:115px 1fr;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding:16px 0}
.relation:last-child{border-bottom:0}
.relation .avatar{width:115px;background:#fff1f5;border-radius:17px}
.relation p{color:#716578;font-size:14px;margin-top:5px}
.album{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.memory{background:linear-gradient(145deg,#fffdfc,#fff1f5);border:1px solid #f0dce8;border-radius:18px;padding:22px;min-height:155px}
.memory.locked{background:#f9f6f9;color:#8d8391;border-style:dashed}
.memory b{display:block;font-size:18px;margin:6px 0}
.memory .symbol{font-size:30px}
.notice{padding:13px 16px;background:#fff0f5;border-radius:14px;color:#855269;font-size:13px}
.foot{margin-top:28px;text-align:center;color:#948794;font-size:12px}
.story-app{min-height:100svh;max-width:1080px;margin:auto;padding:20px}
.story-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.story-scene{border-radius:28px;overflow:hidden;border:1px solid #eadce5;position:relative;min-height:390px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(145deg,var(--scene-bg,#ffe5de),#fff9f4);box-shadow:var(--shadow)}
.story-scene:after{content:"";position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(transparent,#4d304d22);pointer-events:none}
.scenery{position:absolute;inset:0;overflow:hidden}
.scenery:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;top:-120px;right:5%;background:#fff9e5aa}
.scenery:after{content:"";position:absolute;width:100%;height:15%;left:0;bottom:0;background:#997d8766}
.scenery-label{position:absolute;left:24px;top:22px;color:#655060;font-size:14px;letter-spacing:1px;font-weight:900;background:#ffffffa8;padding:7px 13px;border-radius:30px}
.scenery-decoration{position:absolute;left:9%;top:25%;font-size:78px;opacity:.65}
.story-scene .avatar{width:min(360px,62vw);position:relative;z-index:2;transform:translateY(37px);filter:drop-shadow(0 12px 0 #ad738a16)}
.story-box{background:#fff;border:1px solid #ecdce4;border-radius:25px;padding:25px 28px;box-shadow:var(--shadow);margin-top:-13px;position:relative;z-index:3}
.story-box .speaker{color:#ae5c89;font-size:13px;font-weight:900;letter-spacing:.5px}
.story-box .line{font-size:clamp(18px,2.8vw,22px);line-height:1.65;min-height:66px;margin:8px 0 18px;word-break:keep-all}
.story-choices{display:grid;gap:10px;margin-top:10px}
.choice{display:block;width:100%;text-align:left;border:1px solid #efdfe8;border-radius:14px;background:#fff6fa;color:#524253;padding:14px 16px;font-weight:800;min-height:52px}
.choice:hover{background:#fceaf3}
.story-controls{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.result-heart{font-size:29px;color:#d96291;font-weight:900}
.progress{height:6px;background:#f4e9ef;border-radius:99px;overflow:hidden;margin-bottom:19px}
.progress span{display:block;height:100%;background:#db7fa7;transition:width .2s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:90vw;background:#443548;color:#fff;border-radius:15px;padding:13px 20px;z-index:10;text-align:center;box-shadow:0 7px 22px #44354840;font-size:14px}
[hidden]{display:none!important}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr .55fr;gap:0}}
@media(max-width:650px){.wrap{padding:14px 14px 38px}.top{margin-bottom:17px}.brand{font-size:21px}.hero{padding:24px 22px;grid-template-columns:1fr}.hero-art{min-height:155px}.hero-art .avatar{width:155px}.hero-art:before{width:150px;height:150px}.grid{gap:10px}.npc{padding:12px;border-radius:18px}.npc .portrait-box{min-height:130px;margin:6px 0 12px}.npc .avatar{width:130px}.npc .name{font-size:18px}.npc .quote{min-height:90px}.npc .job{font-size:11px}.npc .btn{padding:10px 8px;font-size:12px}.panel{padding:16px}.album{grid-template-columns:1fr}.story-app{padding:12px}.story-scene{min-height:320px}.story-box{padding:21px 18px}.relation{grid-template-columns:90px 1fr;gap:12px}.relation .avatar{width:90px}.scenery-decoration{left:5%;font-size:54px}.hero h1{font-size:32px}}
@media(max-width:380px){.npc .portrait-box{min-height:115px}.npc .avatar{width:115px}.npc .quote{font-size:12px;min-height:100px}.npc{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>

let state, gallery, page='home', scene=null, step=0, result=null;
function $ (selector){return document.querySelector(selector)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function newState(){return {day:1,energy:2,aff:{},stage:{},last:{},choices:{},secretSeen:[],partner:null,history:[]}}
function load(){
try{state=JSON.parse(localStorage.getItem(KEY))||newState()}catch(e){state=newState()}
if(!state||typeof state!=='object')state=newState();
state.aff=state.aff&&typeof state.aff==='object'?state.aff:{};
state.stage=state.stage&&typeof state.stage==='object'?state.stage:{};
state.last=state.last&&typeof state.last==='object'?state.last:{};
state.choices=state.choices&&typeof state.choices==='object'?state.choices:{};
state.secretSeen=Array.isArray(state.secretSeen)?state.secretSeen:[];
state.history=Array.isArray(state.history)?state.history:[];
state.day=Math.max(1,Number(state.day)||1);
state.energy=Math.max(0,Math.min(2,Number.isFinite(Number(state.energy))?Number(state.energy):2));
if(!CAST.some(c=>c.id===state.partner))state.partner=null;
try{gallery=JSON.parse(localStorage.getItem(ALBUM_KEY))||{}}catch(e){gallery={}}
if(!gallery||typeof gallery!=='object')gallery={};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장 공간이 부족해 진행 상황을 저장하지 못했어요.')}}
function saveGallery(){try{localStorage.setItem(ALBUM_KEY,JSON.stringify(gallery))}catch(e){toast('엔딩 앨범을 저장하지 못했어요.')}}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,2900)}
function cast(id){return CAST.find(c=>c.id===id)}
function affection(id){return Math.max(0,Math.min(10,Number(state.aff[id])||0))}
function chapter(id){return Math.max(0,Math.min(STORIES[id].length,Number(state.stage[id])||0))}
function portrait(c,size){const m=c.mood||0,v=c.look||0,i=c.species||0,ys=[0,324,612],hs=[324,288,275],h=hs[m];
return '<div class="avatar '+(size||'')+'" role="img" aria-label="'+esc(c.name||'나')+' 캐릭터"><span class="sprite" style="aspect-ratio:295.6667/'+h+';background-image:url(./assets/animals-looks-v2-'+v+'.webp);background-size:600% '+(887/h*100)+'%;background-position:'+(i*20)+'% '+(ys[m]/(887-h)*100)+'%"></span></div>'}
function player(){
try{const v=JSON.parse(localStorage.getItem('moadong-v1'));if(v&&v.char&&Number.isInteger(v.char.species)&&v.char.species>=0&&v.char.species<=5)return {name:'나',species:v.char.species,look:Math.min(2,Math.max(0,v.char.look||0)),mood:Math.min(2,Math.max(0,v.char.mood||0))}}catch(e){}
return {name:'나',species:0,look:0,mood:1};
}
function level(id){const n=chapter(id),a=affection(id);if(state.partner===id)return '연인';if(n===0)return '처음 만날 사이';if(n<3)return '서로 알아가는 중';if(n<5)return '조금 가까운 사이';if(n<7)return '비밀을 나눈 사이';if(n<8)return '마음이 깊어지는 중';return a<8?'서로를 더 이해하는 중':'고백을 기다리는 사이'}
function hearts(id){const n=affection(id);let h='<div class="aff" aria-label="호감도 '+n+' / 10">';for(let i=0;i<10;i++)h+='<i class="'+(i<n?'on':'')+'"></i>';return h+'</div><div class="aff-text">♥ '+n+' / 10 · '+level(id)+'</div>'}
function mainShell(inner){
$('#app').innerHTML='<div class="wrap"><header class="top"><div class="brand">거봉동네<small>우연이 사랑이 될 때</small></div><div class="row"><span class="stat">DAY '+state.day+'</span><span class="stat">오늘의 만남 '+state.energy+' / 2</span><a class="link" href="./index.html">생활 모드로 돌아가기</a></div></header><nav class="menu" aria-label="연애 모드 메뉴">'+[['home','골목 산책'],['relations','인연 노트'],['album','추억 앨범']].map(function(t){return '<button class="btn '+(page===t[0]?'active':'')+'" onclick="showPage(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</nav>'+inner+'<div class="foot">기존 생활 모드와 별도로 자동 저장됩니다 · 캐릭터 모습은 생활 모드에서 가져옵니다.</div></div>';
}
function showPage(p){scene=null;page=p;render()}
function render(){
if(!state){load()}
if(page==='relations')return renderRelations();
if(page==='album')return renderAlbum();
let progress=CAST.reduce((n,c)=>n+chapter(c.id),0);
let hero='<section class="hero"><div><span class="pill">거봉동네 연애 시뮬레이션</span><h1>오늘, 누군가를<br>좋아하게 될지도 몰라.</h1><p class="desc">같은 골목에서 네 사람과 우연히 마주칩니다. 어떤 말을 건넬지, 누구와 시간을 보낼지 모두 당신의 선택이에요.</p><div class="actions"><span class="stat">기억한 장면 '+progress+' / '+CAST.reduce((n,c)=>n+STORIES[c.id].length,0)+'</span><span class="stat">발견한 연애 엔딩 '+Object.keys(gallery).filter(k=>gallery[k]).length+' / 4</span></div></div><div class="hero-art">'+portrait(player())+'</div></section>';
let cards=CAST.map(function(c){let done=state.last[c.id]===state.day;return '<article class="npc" style="--accent:'+c.accent+';--bg:'+c.bg+'"><div class="pill">'+c.tag+'</div><div class="portrait-box">'+portrait(c)+'</div><div class="name">'+c.name+'</div><div class="job">'+c.job+'</div><p class="quote">'+esc(c.quote)+'</p>'+hearts(c.id)+'<button class="btn '+(state.partner===c.id?'primary':'')+'" onclick="meet(\''+c.id+'\')" '+(done||!state.energy?'disabled':'')+'>'+(state.partner===c.id?'연인과 데이트':done?'오늘은 이미 만났어요':chapter(c.id)===0?'첫 만남':chapter(c.id)>=STORIES[c.id].length&&affection(c.id)>=8&&state.day>=9&&!state.partner?'마음을 전하기':'만나러 가기')+'</button>'+secretButton(c,done)+'</article>'}).join('');
let partner=state.partner?cast(state.partner):null;
mainShell(hero+'<div class="section-header"><div><h2>누구를 만나러 갈까?</h2><p>하루에 두 번 만날 수 있어요. 같은 주민은 하루에 한 번만.</p></div></div><div class="grid">'+cards+'</div><div class="section-header"><div><h2>오늘의 기록</h2><p>'+(partner?partner.name+'와(과) 연인이 되었어요.':'마음이 닿는 방향을 천천히 찾아보세요.')+'</p></div></div><div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><p class="sub">'+(state.energy?'아직 '+state.energy+'번의 만남이 남았어요.':'오늘의 만남을 모두 마쳤어요. 다음 날로 넘어갈까요?')+'</p><button class="btn primary" onclick="sleepDay()">밤이 지나고 · 다음 날</button></div></div><div class="actions"><button class="btn ghost" onclick="resetRomance()">연애 진행 초기화</button></div>');
}
function renderRelations(){
mainShell('<section class="panel"><h1>인연 노트</h1><p class="sub" style="margin:6px 0 17px">마주친 순간과 대화의 선택이 호감도를 바꿉니다.</p>'+CAST.map(function(c){
return '<div class="relation">'+portrait(c)+'<div><h3>'+c.name+' · '+level(c.id)+'</h3><p>'+c.tag+' · 이야기 '+chapter(c.id)+' / '+STORIES[c.id].length+'</p>'+hearts(c.id)+'<p>'+esc(c.quote)+'</p>'+secretStatus(c.id)+'</div></div>'
}).join('')+'</section><div class="section-header"><h2>사소한 순간들</h2></div><section class="panel">'+(state.history.length?state.history.slice(0,22).map(function(h){const c=cast(h.id);return '<p class="sub" style="padding:10px 0;border-bottom:1px solid #f1e6ed"><b>DAY '+h.day+' · '+esc(c?c.name:'동네')+'</b> — '+esc(h.title)+'<br>'+esc(h.text)+'</p>'}).join(''):'<p class="sub">아직 남겨진 추억이 없어요. 골목에서 누군가를 만나 보세요.</p>')+'</section>');
}
function renderAlbum(){renderSpecialAlbum()}

function sleepDay(){state.day++;state.energy=2;save();render();toast('새로운 하루가 시작됐어요. 오늘도 좋은 만남이 있길!')}
function resetRomance(){if(!confirm('호감·신뢰, 연인 관계와 대화 기록을 지우고 1일 차부터 시작할까요? 수집한 CG·엔딩과 생활 모드 기록은 보관됩니다.'))return;state=newState();save();page='home';render();toast('새로운 이야기가 시작됐어요.')}
function meet(id){
const c=cast(id);if(!c)return;
if(!state.energy){toast('오늘의 만남은 끝났어요. 다음 날을 시작해 주세요.');return}
if(state.last[id]===state.day){toast('오늘은 이미 만났어요. 다음 날 또 만나요.');return}
const st=chapter(id), a=affection(id);
let type='event';
if(state.partner===id)type='date';
else if(st>=STORIES[id].length)type=state.partner?'friend':a>=8&&state.day>=9?'confession':'talk';
let data;
if(type==='event')data=storyAt(id,st);
if(type==='talk')data={title:'조금 더 가까이',place:c.place,decoration:c.decoration,lines:[['나레이션',c.place+'에서 '+c.name+'와(과) 잠시 이야기를 나눈다.'],[c.name,'사소한 얘기도 네게 들려주면 조금 특별해져.'],[c.name,'다음에도 이렇게 이야기하자.']],choices:[['“응. 네 이야기가 궁금해.”',2,'서로의 작은 하루를 나누는 시간이 길어졌다.'],['“오늘 만나서 반가웠어.”',1,'따뜻한 인사를 나누었다.'],['“나중에 보자.”',0,'다음 만남을 기약했다.']]};
if(type==='friend')data={title:'오래된 친구',place:c.place,decoration:c.decoration,lines:[['나레이션','서로 다른 마음도 시간이 지나면 소중한 우정이 된다.'],[c.name,'다음에도 이 골목에서 웃으며 인사하자.']],choices:[['“우리 오래 친구하자.”',1,'두 사람은 편안하게 웃었다.'],['“오늘도 즐거웠어.”',1,'소중한 우정이 하나 더 쌓였다.']]};
if(type==='date')data=dateFor(id);
if(type==='confession')data=confessionFor(id);
scene={id,type,data,cgId:(cgForEvent(id,type,st)||{}).id||null};step=0;result=null;renderScene();
}
function renderScene(){
const c=cast(scene.id), data=scene.data, done=step>=data.lines.length;
let line=done?null:data.lines[step];
let body='<div class="story-app"><div class="story-top"><div class="brand">거봉동네<small>'+esc(data.title)+' · DAY '+state.day+'</small></div><button class="btn ghost" onclick="leaveScene()">돌아가기</button></div><div class="progress" aria-hidden="true"><span style="width:'+((step+1)/(data.lines.length+1)*100)+'%"></span></div><div class="story-scene" style="--scene-bg:'+c.bg+'">'+scenePicture(c,line)+'</div><section class="story-box" aria-live="polite">';
if(result){
body+='<div class="speaker">'+c.name+' · '+esc(data.title)+'</div><p class="line">'+esc(result.text)+'</p><p class="result-heart">'+(result.score?'♥ +'+result.score:'♥ 마음의 거리 그대로')+'</p>'+(result.newCG?'<div class="notice">✦ 새로운 이벤트 CG를 발견했어요! 추억 앨범에 보관됩니다.</div>':'')+(result.secret?'<div class="notice">숨겨진 이야기를 발견했어요.</div>':'')+(result.ending?'<h2 style="margin:10px 0">ENDING · '+esc(c.ending)+'</h2><p class="sub">'+esc(c.endingText)+'</p>':'')+'<div class="story-controls"><button class="btn primary" onclick="leaveScene()">동네로 돌아가기</button></div>';
}else if(!done){
body+='<div class="speaker">'+esc(line[0])+'</div><p class="line">'+esc(line[1])+'</p><div class="story-controls"><button class="btn primary" onclick="nextLine()">다음 이야기 →</button></div>';
}else{
body+='<div class="speaker">당신의 선택</div><p class="line">'+esc(c.name)+'에게 어떤 말을 전할까요?</p><div class="story-choices">'+data.choices.map(function(choice,i){return '<button class="choice" onclick="chooseAnswer('+i+')">'+(i+1)+'. '+esc(choice[0])+'</button>'}).join('')+'</div>';
}
$('#app').innerHTML=body+'</section><div class="foot">1 · 2 · 3 키로 선택 · Enter 키로 대사 넘기기</div></div>';
}
function nextLine(){if(!scene||result)return;step=Math.min(scene.data.lines.length,step+1);renderScene()}
function chooseAnswer(i){
if(!scene||result||step<scene.data.lines.length)return;
let d=scene.data,ch=d.choices[i];if(!ch)return;
const id=scene.id,c=cast(id),type=scene.type,score=ch[1];const newCG=!!(scene.cgId&&!gallery.cgs[scene.cgId]);const earned=!!(type==='confession'&&i===0&&!state.partner);
state.energy=Math.max(0,state.energy-1);
state.aff[id]=Math.min(10,affection(id)+score);
state.last[id]=state.day;
if(type==='event'){if(!Array.isArray(state.choices[id]))state.choices[id]=[];state.choices[id][chapter(id)]=i;state.stage[id]=Math.min(STORIES[id].length,chapter(id)+1)}
if(type==='secret'&&scene.secretId&&!state.secretSeen.includes(scene.secretId)){state.secretSeen.push(scene.secretId);gallery.secrets[scene.secretId]=true}
if(scene.cgId&&(type==='event'||type==='secret')){gallery.cgs[scene.cgId]=true}
if(earned){state.partner=id;gallery[id]=true}
if(type==='event'||type==='secret'||earned)saveGallery()
state.history.unshift({id,day:state.day,title:earned?'ENDING · '+c.ending:d.title,text:ch[2]});
state.history=state.history.slice(0,70);
save();result={score:score,text:ch[2],ending:earned,newCG:newCG,secret:type==='secret'};renderScene();
}
function leaveScene(){scene=null;result=null;page='home';render()}
document.addEventListener('keydown',function(e){
if(!scene||e.repeat||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(document.activeElement.tagName))return;
if(e.key==='Enter'&&!result&&step<scene.data.lines.length){e.preventDefault();nextLine();return}
if(!result&&step>=scene.data.lines.length&&/^[1-3]$/.test(e.key)){e.preventDefault();chooseAnswer(Number(e.key)-1)}
});
load();

const crossroads={"momo":[5,"내일 첫 잔은 내가 주문할게. 메뉴 이름은 비밀로 해 줘.","모모가 예약표에 작은 하트를 그렸다.","메뉴판은 뒤집어 둘까? 결정은 내일 해도 돼.","모모는 분필을 내려놓고 네 옆에 앉았다.","세 잔 중 하나만 지금 같이 만들어 보자.","둘의 앞치마에 같은 모양으로 시럽이 튀었다."],"rui":[5,"주인공이 손을 잡으면 좋겠어. 내가 좋아하는 장면이거든.","루이가 네 손등을 힐끗 봤다.","다음 줄은 비워 두자. 네가 먼저 읽어 주는 날까지.","루이가 연필을 내려놓고 책갈피를 끼웠다.","한 줄씩 번갈아 써 볼까?","두 사람의 글씨가 같은 줄에서 만났다."],"sion":[5,"솔직히 벌써 보고 싶어. 역까지 같이 가도 돼?","시온이 기차표 옆자리에 네 이름을 써 보았다.","답장 걱정 없이 다녀와. 첫 전시는 네 속도로 봐.","시온은 접어 둔 전시 계획을 끝까지 펼쳤다.","일요일마다 서로 본 풍경을 한 장씩 바꾸자.","시온이 달력에 작은 네모를 그렸다."],"doha":[5,"다음 버스도 보내자. 아직 같이 있고 싶어.","도하가 네 쪽으로 반 걸음 옮겼다.","결과가 나오면 네가 먼저 알려 줘. 기다릴게.","도하는 휴대폰을 주머니에 넣고 편하게 숨을 내쉬었다.","나도 좀 걱정돼. 정류장 하나만 걸으며 얘기할까?","도하가 노선도를 접고 너와 보폭을 맞췄다."]};
for(const [id,[chapterIndex,...words]] of Object.entries(crossroads)){
  STORIES[id][chapterIndex].choices=[0,1,2].map((_,slot)=>{
    const style=(slot+CAST.findIndex(c=>c.id===id))%3;
    return [words[style*2],[2,0,1][style],words[style*2+1],[0,2,1][style]];
  });
}
function trust(id){
  return (state.choices[id]||[]).reduce((sum,answer,n)=>{
    const choice=STORIES[id][n]?.choices[answer];
    return Math.min(10,sum+(choice?.[3]??(choice?.[1]>0?1:0)));
  },0);
}
const originalStory=storyAt;
storyAt=function(id,n){
  const data=originalStory(id,n);
  if(n===6){
    const prev=STORIES[id][5].choices[state.choices[id]?.[5]];
    if(prev)data.lines.splice(1,0,['나레이션',prev[2]+' 그날의 일이 떠오른다.']);
  }
  return data;
};
const originalSecret=secretAvailable;
secretAvailable=function(id){return originalSecret(id)&&trust(id)>=3};
const originalHearts=hearts;
hearts=function(id){return originalHearts(id)+'<div class="sub">신뢰 '+trust(id)+' / 10</div>'};
const originalPicture=scenePicture;
scenePicture=function(c,line){
 if(scene.cgId)return originalPicture(c,line);
 const art={momo:'cafe',rui:'books',sion:'sunset',doha:'river'}[c.id];
 return '<div class="scene-paint painted-'+art+'"></div><span class="scenery-label">'+esc(scene.data.place)+'</span>'+emotionPortrait(c,line);
};
render();</script></body></html>

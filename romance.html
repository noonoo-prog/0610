<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>거봉동네 · 우연이 사랑이 될 때</title>
<style>
:root{color-scheme:light;--ink:#332a3b;--muted:#796d80;--line:#ecdce5;--pink:#e86d93;--purple:#7f67a7;--paper:#fffbfd;--shadow:0 18px 55px #56334912}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(circle at 10% 8%,#ffe7df 0,transparent 30%),radial-gradient(circle at 95% 20%,#eee0ff 0,transparent 34%),#fff8f6;color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #8d53a9;outline-offset:3px}
button:disabled{opacity:.47;cursor:not-allowed}
a{color:inherit}
.wrap{max-width:1110px;margin:auto;padding:24px 22px 46px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-size:24px;font-weight:900;letter-spacing:-1.2px}
.brand small{display:block;font-size:11px;letter-spacing:2px;font-weight:800;color:var(--purple)}
.link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #e6d5e1;background:#fff9fc;border-radius:14px;padding:11px 16px;font-weight:800;min-height:44px}
.pill{display:inline-block;border-radius:99px;background:#fff0f5;color:#a94e76;font-size:12px;font-weight:900;letter-spacing:.3px;padding:5px 11px}
.stat{display:inline-flex;align-items:center;gap:7px;border:1px solid #efdfe8;border-radius:13px;padding:8px 12px;background:#fffafc;font-size:13px;font-weight:800}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(27px,4.4vw,45px);line-height:1.25;letter-spacing:-1.8px}
h2{font-size:clamp(22px,3vw,28px);line-height:1.35;letter-spacing:-.8px}
h3{font-size:17px;letter-spacing:-.35px}
p{line-height:1.75}
.sub{color:var(--muted);font-size:14px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:25px;align-items:center;background:linear-gradient(125deg,#fff,#fff3f5 70%,#efe1fa);border:1px solid #f2e4eb;border-radius:30px;padding:32px 35px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero:before{content:"✦";position:absolute;right:25%;top:13px;font-size:42px;color:#e9b8ce66}
.hero h1{margin:13px 0 12px}
.hero .desc{color:#675b69;max-width:550px}
.hero-art{position:relative;min-height:235px;display:grid;place-items:center}
.hero-art:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffdedf;filter:blur(2px)}
.hero-art:after{content:"♥";position:absolute;top:0;right:10%;font-size:44px;color:#e99abe;transform:rotate(13deg)}
.hero-art .avatar{position:relative;z-index:1;width:220px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border-radius:14px;padding:12px 18px;font-weight:850;background:#f9edf2;color:#5b4960;border:1px solid #ecdbe4;min-height:46px;box-shadow:0 3px 0 #48293b08}
.btn:hover:not(:disabled){filter:brightness(.98);transform:translateY(-1px)}
.btn.primary{color:#fff;background:#a35d8b;border-color:#a35d8b}
.btn.light{background:#fff}
.btn.ghost{background:transparent;border-color:#d8cbd6}
.btn.full{width:100%}
.menu{display:flex;gap:8px;overflow-x:auto;margin:20px 0;padding:3px 2px 6px}
.menu .btn{white-space:nowrap}
.menu .btn.active{color:#fff;background:#5b465f;border-color:#5b465f}
.section-header{margin:27px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:12px}
.section-header p{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.npc{position:relative;background:#fff;border:1px solid #f0e4eb;border-radius:22px;padding:17px;box-shadow:0 10px 25px #4d2f4810;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.npc:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--accent,#e7a2be)}
.npc .portrait-box{display:grid;place-items:center;min-height:170px;background:var(--bg,#fff0f4);border-radius:17px;margin:8px 0 13px;position:relative;overflow:hidden}
.npc .portrait-box:after{content:"♥";position:absolute;right:12px;top:4px;color:#ffffff95;font-size:38px}
.npc .avatar{position:relative;z-index:1;width:168px}
.npc .name{font-size:20px;font-weight:900;line-height:1.3}
.npc .job{font-size:12px;color:#876f83;margin:4px 0 8px;min-height:20px}
.npc .quote{color:#655767;font-size:13px;min-height:70px;flex:1}
.npc .btn{margin-top:14px;width:100%;font-size:14px}
.aff{display:flex;gap:5px;align-items:center;margin-top:11px}
.aff i{height:7px;border-radius:8px;background:#f2e5eb;flex:1;min-width:0}
.aff i.on{background:#e77c9b}
.aff-text{font-size:12px;color:#9b5279;font-weight:900;margin-top:5px}
.avatar{aspect-ratio:1;display:grid;place-items:center}
.avatar .sprite{width:87%;background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 5px 2px #4530400e)}
.panel{background:#fff;border:1px solid #f0e4eb;border-radius:23px;padding:23px;box-shadow:var(--shadow)}
.relation{display:grid;grid-template-columns:115px 1fr;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding:16px 0}
.relation:last-child{border-bottom:0}
.relation .avatar{width:115px;background:#fff1f5;border-radius:17px}
.relation p{color:#716578;font-size:14px;margin-top:5px}
.album{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.memory{background:linear-gradient(145deg,#fffdfc,#fff1f5);border:1px solid #f0dce8;border-radius:18px;padding:22px;min-height:155px}
.memory.locked{background:#f9f6f9;color:#8d8391;border-style:dashed}
.memory b{display:block;font-size:18px;margin:6px 0}
.memory .symbol{font-size:30px}
.notice{padding:13px 16px;background:#fff0f5;border-radius:14px;color:#855269;font-size:13px}
.foot{margin-top:28px;text-align:center;color:#948794;font-size:12px}
.story-app{min-height:100svh;max-width:1080px;margin:auto;padding:20px}
.story-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.story-scene{border-radius:28px;overflow:hidden;border:1px solid #eadce5;position:relative;min-height:390px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(145deg,var(--scene-bg,#ffe5de),#fff9f4);box-shadow:var(--shadow)}
.story-scene:after{content:"";position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(transparent,#4d304d22);pointer-events:none}
.scenery{position:absolute;inset:0;overflow:hidden}
.scenery:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;top:-120px;right:5%;background:#fff9e5aa}
.scenery:after{content:"";position:absolute;width:100%;height:15%;left:0;bottom:0;background:#997d8766}
.scenery-label{position:absolute;left:24px;top:22px;color:#655060;font-size:14px;letter-spacing:1px;font-weight:900;background:#ffffffa8;padding:7px 13px;border-radius:30px}
.scenery-decoration{position:absolute;left:9%;top:25%;font-size:78px;opacity:.65}
.story-scene .avatar{width:min(360px,62vw);position:relative;z-index:2;transform:translateY(37px);filter:drop-shadow(0 12px 0 #ad738a16)}
.story-box{background:#fff;border:1px solid #ecdce4;border-radius:25px;padding:25px 28px;box-shadow:var(--shadow);margin-top:-13px;position:relative;z-index:3}
.story-box .speaker{color:#ae5c89;font-size:13px;font-weight:900;letter-spacing:.5px}
.story-box .line{font-size:clamp(18px,2.8vw,22px);line-height:1.65;min-height:66px;margin:8px 0 18px;word-break:keep-all}
.story-choices{display:grid;gap:10px;margin-top:10px}
.choice{display:block;width:100%;text-align:left;border:1px solid #efdfe8;border-radius:14px;background:#fff6fa;color:#524253;padding:14px 16px;font-weight:800;min-height:52px}
.choice:hover{background:#fceaf3}
.story-controls{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.result-heart{font-size:29px;color:#d96291;font-weight:900}
.progress{height:6px;background:#f4e9ef;border-radius:99px;overflow:hidden;margin-bottom:19px}
.progress span{display:block;height:100%;background:#db7fa7;transition:width .2s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:90vw;background:#443548;color:#fff;border-radius:15px;padding:13px 20px;z-index:10;text-align:center;box-shadow:0 7px 22px #44354840;font-size:14px}
[hidden]{display:none!important}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr .55fr;gap:0}}
@media(max-width:650px){.wrap{padding:14px 14px 38px}.top{margin-bottom:17px}.brand{font-size:21px}.hero{padding:24px 22px;grid-template-columns:1fr}.hero-art{min-height:155px}.hero-art .avatar{width:155px}.hero-art:before{width:150px;height:150px}.grid{gap:10px}.npc{padding:12px;border-radius:18px}.npc .portrait-box{min-height:130px;margin:6px 0 12px}.npc .avatar{width:130px}.npc .name{font-size:18px}.npc .quote{min-height:90px}.npc .job{font-size:11px}.npc .btn{padding:10px 8px;font-size:12px}.panel{padding:16px}.album{grid-template-columns:1fr}.story-app{padding:12px}.story-scene{min-height:320px}.story-box{padding:21px 18px}.relation{grid-template-columns:90px 1fr;gap:12px}.relation .avatar{width:90px}.scenery-decoration{left:5%;font-size:54px}.hero h1{font-size:32px}}
@media(max-width:380px){.npc .portrait-box{min-height:115px}.npc .avatar{width:115px}.npc .quote{font-size:12px;min-height:100px}.npc{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>

function $ (selector){return document.querySelector(selector)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function newState(){return {day:1,energy:2,aff:{},stage:{},last:{},partner:null,history:[]}}

body+='<div class="speaker">'+esc(line[0])+'</div><p class="line">'+esc(line[1])+'</p><div class="story-controls"><button class="btn primary" onclick="nextLine()">다음 이야기 →</button></div>';
}else{
body+='<div class="speaker">당신의 선택</div><p class="line">'+esc(c.name)+'에게 어떤 말을 전할까요?</p><div class="story-choices">'+data.choices.map(function(choice,i){return '<button class="choice" onclick="chooseAnswer('+i+')">'+(i+1)+'. '+esc(choice[0])+'</button>'}).join('')+'</div>';
}
$('#app').innerHTML=body+'</section><div class="foot">1 · 2 · 3 키로 선택 · Enter 키로 대사 넘기기</div></div>';
}
function nextLine(){if(!scene||result)return;step=Math.min(scene.data.lines.length,step+1);renderScene()}
function chooseAnswer(i){
if(!scene||result||step<scene.data.lines.length)return;
let d=scene.data,ch=d.choices[i];if(!ch)return;
const id=scene.id,c=cast(id),type=scene.type,score=ch[1];const earned=!!(type==='confession'&&i===0&&!state.partner);
state.energy=Math.max(0,state.energy-1);
state.aff[id]=Math.min(10,affection(id)+score);
state.last[id]=state.day;
if(type==='event')state.stage[id]=Math.min(3,chapter(id)+1);
if(earned){state.partner=id;gallery[id]=true;saveGallery()}
state.history.unshift({id,day:state.day,title:earned?'ENDING · '+c.ending:d.title,text:ch[2]});
state.history=state.history.slice(0,70);
save();result={score:score,text:ch[2],ending:earned};renderScene();
}
function leaveScene(){scene=null;result=null;page='home';render()}
document.addEventListener('keydown',function(e){
if(!scene||e.repeat||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(document.activeElement.tagName))return;
if(e.key==='Enter'&&!result&&step<scene.data.lines.length){e.preventDefault();nextLine();return}
if(!result&&step>=scene.data.lines.length&&/^[1-3]$/.test(e.key)){e.preventDefault();chooseAnswer(Number(e.key)-1)}
});
load();render();
</script>
</body></html>

name: SANGEO inspection smoke test
on:
  workflow_run:
    workflows: ["Deploy SANGEO Inspection"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check staff homepage serves HTML
        shell: bash
        run: |
          set -euo pipefail
          site="https://noonoo-prog.github.io/0610/"
          for attempt in {1..12}; do
            code="$(curl -L --max-time 20 -sS -D /tmp/sangeo-headers -o /tmp/sangeo-page -w '%{http_code}' "$site")"
            if [[ "$code" == "200" ]] && grep -Eqi '^content-type: text/html' /tmp/sangeo-headers && grep -q '<!doctype html>' /tmp/sangeo-page; then
              break
            fi
            sleep 5
          done
          test "$code" = "200"
          grep -Eqi '^content-type: text/html' /tmp/sangeo-headers
          grep -q '<meta charset="utf-8">' /tmp/sangeo-page
          grep -q 'sangeo-inspection' /tmp/sangeo-page
          grep -q 'downloadPhotoBook' /tmp/sangeo-page
          grep -q 'id="photoalbum"' /tmp/sangeo-page
          grep -q 'photo-download' /tmp/sangeo-page
          grep -q 'id="fieldPhotos"' /tmp/sangeo-page
          grep -q 'photo-category' /tmp/sangeo-page
          grep -q 'id="locationPhotos"' /tmp/sangeo-page
          grep -q 'id="buildingCare"' /tmp/sangeo-page
          grep -q 'id="wsPane-onsite"' /tmp/sangeo-page
          grep -q 'id="wsPane-care"' /tmp/sangeo-page
          grep -q 'id="wsPane-photos"' /tmp/sangeo-page
          grep -q 'id="wsPane-evaluation"' /tmp/sangeo-page
          grep -q 'id="visitTrash"' /tmp/sangeo-page
          grep -q 'restoreTrashedVisit' /tmp/sangeo-page
          grep -q "api('photo-check'" /tmp/sangeo-page
          grep -q "api('care-schedule'" /tmp/sangeo-page
          echo "Staff website is published and served as HTML"
      - name: Check API readiness and login protection
        shell: bash
        run: |
          set -euo pipefail
          api="https://zcnvkfhemgmhbnsvorbd.supabase.co/functions/v1/sangeo-inspection"
          curl --max-time 20 -fsS "$api?op=status" | jq -e '(.configured | type) == "boolean"'
          code="$(curl --max-time 20 -sS -o /tmp/blocked -w '%{http_code}' "$api?op=buildings")"
          test "$code" = "401"
          jq -e '.error | type == "string"' /tmp/blocked
          echo "Private building data is unavailable without a password session"
          photo_code="$(curl --max-time 20 -sS -o /tmp/blocked-photo -w '%{http_code}' "$api?op=photo-download&id=00000000-0000-4000-8000-000000000001")"
          test "$photo_code" = "401"
          echo "Private photo bytes require a valid staff session"
          category_code="$(curl --max-time 20 -sS -o /tmp/blocked-category -w '%{http_code}' -X PATCH "$api?op=photo-category" -H 'Content-Type: application/json' -d '{}' )"
          test "$category_code" = "401"
          echo "Photo reassignment is restricted to authenticated staff"
          shot_code="$(curl --max-time 20 -sS -o /tmp/blocked-shot -w '%{http_code}' -X PUT "$api?op=photo-check" -H 'Content-Type: application/json' -d '{}')"
          care_code="$(curl --max-time 20 -sS -o /tmp/blocked-care -w '%{http_code}' -X PUT "$api?op=care-schedule" -H 'Content-Type: application/json' -d '{}')"
          test "$shot_code" = "401"
          test "$care_code" = "401"
          echo "Photo check and care schedule remain available only to logged-in staff"
          trash_code="$(curl --max-time 20 -sS -o /tmp/blocked-visit-trash -w '%{http_code}' -X PATCH "$api?op=visit-trash" -H 'Content-Type: application/json' -d '{}')"
          test "$trash_code" = "401"
          echo "Inspection trash and restore require a signed-in session"
      - name: Check cross-site browser preflight
        shell: bash
        run: |
          set -euo pipefail
          api="https://zcnvkfhemgmhbnsvorbd.supabase.co/functions/v1/sangeo-inspection"
          code="$(curl --max-time 20 -sS -D /tmp/sangeo-cors -o /dev/null -w '%{http_code}' -X OPTIONS "$api?op=login" -H 'Origin: https://noonoo-prog.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type')"
          test "$code" = "204"
          grep -Eqi '^access-control-allow-origin: https://noonoo-prog.github.io' /tmp/sangeo-cors
          grep -Eqi '^access-control-allow-headers:.*content-type' /tmp/sangeo-cors
          echo "CORS preflight allows the staff website"
      - name: Check old URL redirect
        shell: bash
        run: |
          set -euo pipefail
          api="https://zcnvkfhemgmhbnsvorbd.supabase.co/functions/v1/sangeo-inspection"
          code="$(curl --max-time 20 -sS -D /tmp/sangeo-redirect -o /dev/null -w '%{http_code}' "$api")"
          test "$code" = "302"
          grep -Eqi '^location: https://noonoo-prog.github.io/0610/' /tmp/sangeo-redirect
          echo "Old Supabase URL redirects to the frontend"

name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "romance.html"
      - "romance-*.js"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check romance CG dimensions (1280 x 576 WebP)
        run: |
          python -m pip install --quiet Pillow
          python - <<'PYTHON'
          from pathlib import Path
          from PIL import Image
          for path in sorted(Path('assets/cg').glob('*.webp')):
              with Image.open(path) as image:
                  image.load()
                  if image.format != 'WEBP' or image.size != (1280, 576):
                      raise SystemExit(f'{path}: expected 1280 x 576 WebP, got {image.size} {image.format}')
          PYTHON
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
